  <!-- Contacto Section-->
  <section class="page-section" id="Contacto">
      <div class="container">
          <!-- Contacto Section Heading-->
          <h2 class="page-section-heading text-center text-uppercase text-secondary mb-0">Contactame</h2>
          <br>
          <br>
          <!-- Contact Section Form-->
          <div class="row justify-content-center">
              <div class="col-lg-8 col-xl-7">
                  <!-- to get an API token!-->
                  <form id="contactForm" data-sb-form-api-token="API_TOKEN">
                      <!-- Nombre input-->
                      <div class="form-floating mb-3">
                          <input class="form-control" id="name" type="text" placeholder="Enter your name..." data-sb-validations="required" oninput="this.value = this.value.replace(/[^a-zA-Z\sÀ-ſ]/g, '')" />
                          <label for="name">Nombre</label>
                          <div class="invalid-feedback" data-sb-feedback="name:required">Nombre Requerido.</div>
                      </div>
                      <!-- Email input-->
                      <div class="form-floating mb-3">
                          <input class="form-control" id="email" type="email" placeholder="name@example.com" data-sb-validations="required,email" />
                          <label for="email">Email</label>
                          <div class="invalid-feedback" data-sb-feedback="email:required">Email requiredo.</div>
                          <div class="invalid-feedback" data-sb-feedback="email:email">Email is not valid.</div>
                      </div>
                     <!-- Numero de telefono input-->
                      <div class="form-floating mb-3">
                          <input class="form-control" id="phone" type="tel" placeholder="9 XXXX XXXX" pattern="9[0-9]{8}" required/>
                          <label for="phone">Numero de celular</label>
                          <div class="invalid-feedback" data-sb-feedback="phone:required">Numero de celular requerido.</div>
                          <div class="invalid-feedback" data-sb-feedback="phone:pattern">El formato debe ser "9 XXXX XXXX".</div>
                      </div>
                      <!-- Mensaje input-->
                      <div class="form-floating mb-3">
                          <textarea class="form-control" id="message" type="text" placeholder="Enter your message here..." style="height: 10rem" data-sb-validations="required"></textarea>
                          <label for="message">Mensaje</label>
                          <div class="invalid-feedback" data-sb-feedback="message:required">Mensaje requiredo.</div>
                      </div>
                      <!-- Mensaje enviado con exito-->
                      <div class="d-none" id="submitSuccessMessage">
                          <div class="text-center mb-3">
                              <div class="fw-bolder">Formulario Enviado!</div>
                          </div>
                      </div>

                      <!-- Mensaje de error-->
                      <div class="d-none" id="submitErrorMessage"><div class="text-center text-danger mb-3">Error sending message!</div></div>
                      <!-- Boton enviado-->
                      <button class="btn btn-primary btn-xl enable" id="submitButton" type="submit">Send</button>
                  </form>
              </div>
          </div>
      </div>
  </section>
